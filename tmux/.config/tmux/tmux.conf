# ~/.config/tmux/tmux.conf — reload with: prefix + r
# Prefix: Ctrl-Space  (alt-* is left free for AeroSpace)

# ── General ───────────────────────────────────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix              # press twice to send Ctrl-Space to the app

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB,xterm-256color:RGB"
set -g mouse on
set -g history-limit 50000
set -s escape-time 10                 # no lag on Esc (vim/helix)
set -g focus-events on
set -s set-clipboard on               # copy to macOS clipboard via Ghostty (OSC 52)
set -g base-index 1                   # windows start at 1 (matches the keyboard)
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off          # closing a session jumps to another instead of exiting tmux

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# ── Splits & windows (open in the current directory) ─────
# vim-style: v = side by side (vertical divider), s = stacked (horizontal divider)
unbind '"'
unbind %
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind w choose-tree -Zs                # session/window picker (s is now a split)
bind c new-window -c "#{pane_current_path}"
bind x kill-pane                      # no confirmation prompt

# ── Pane navigation (vim keys) ────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# Ctrl-h/j/k/l without prefix is handled by vim-tmux-navigator below
# (also works seamlessly with Neovim splits).
# Clear screen + scrollback: prefix + Backspace (Ctrl-l is taken by navigation)
bind BSpace send-keys C-l \; clear-history

# Resize with prefix + Ctrl-h/j/k/l (repeatable; same keys as navigation)
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

# Window switching: prefix + n / p (next/prev), or prefix + number

# ── Copy mode (vi) ────────────────────────────────────────
setw -g mode-keys vi
bind Enter copy-mode                  # also: scroll with the mouse
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# ── Status bar: tokyo-night-tmux (default Night theme) ─
set -g status-position bottom
set -g @tokyo-night-tmux_theme night

# Right-side widgets, in this order (anything not listed is hidden, incl. date/time)
set -g @tokyo-night-tmux_show_right_widgets "path,git,wbg"   # no spaces: tmux quotes values with spaces and the plugin then misreads the first and last items
set -g @tokyo-night-tmux_show_path 1
set -g @tokyo-night-tmux_path_format relative   # relative | full
set -g @tokyo-night-tmux_show_git 1             # local git: changed files, +/- lines
set -g @tokyo-night-tmux_show_wbg 1             # GitHub/GitLab: PRs, issues (needs gh/glab logged in)
set -g @tokyo-night-tmux_show_datetime 0

# Indicators (SSH icon on windows running ssh is built in)
set -g @tokyo-night-tmux_prefix_active_color "#f7768e"   # session badge turns red while prefix is active
set -g @tokyo-night-tmux_zoom_id_style icon              # show an icon on zoomed windows
set -g @tokyo-night-tmux_zoom_icon "󰊓"

# ── Plugins (TPM) ─────────────────────────────────────────
# Install TPM once:  git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm
# Then inside tmux: prefix + I (capital i) to install plugins, prefix + U to update
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'   # Ctrl-h/j/k/l across panes (and nvim)
set -g @vim_navigator_prefix_mapping_clear_screen ''  # don't let it take prefix + Ctrl-l (resize right)
set -g @plugin 'janoamaral/tokyo-night-tmux'        # before resurrect/continuum: continuum hooks into status-right
set -g @plugin 'tmux-plugins/tmux-resurrect'      # prefix + Ctrl-s save, prefix + Ctrl-r restore
set -g @plugin 'tmux-plugins/tmux-continuum'      # auto-save every 15 min, auto-restore
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.config/tmux/plugins"
run '~/.config/tmux/plugins/tpm/tpm'              # keep this line last
